<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
  <title>Biblioteca Online</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/style.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>

  <!-- MENU LATERAL -->
  <nav class="sidebar" id="sidebar">

    <div class="logo">
      <i class="fa-solid fa-book-open"></i>
      <span>Biblioteca Online</span>
    </div>

    <div class="menu">

      <a class="menu-item active" href="#">
        <i class="fa-solid fa-book"></i>
        <span>Livros</span>
      </a>

      <a class="menu-item" onclick="abrirModal()">
        <i class="fa-solid fa-plus"></i>
        <span>Adicionar Livro</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fa-solid fa-tag"></i>
        <span>Recomendados</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fa-solid fa-user"></i>
        <span>Meus Albuns</span>
      </a>

    </div>

    <div class="menu-bottom">

      <a class="menu-item" href="#">
        <i class="fa-solid fa-gear"></i>
        <span>Configurações</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
      </a>

    </div>

  </nav>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content">

    <!-- TOPBAR -->
    <header class="topbar">
      </div>


      <!-- BOTÃO DE TEMA -->
      <button id="themeToggleBtn" class="icon-theme-btn" type="button" title="Ativar tema claro"
        aria-label="Alternar tema">
        <i class="fa-solid fa-moon"></i>
      </button>


      <!-- PERFIL -->
      <div class="user-profile">

        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>

        <span>Usuário</span>

        <i class="fa-solid fa-chevron-down"></i>

      </div>

    </header>


    <!-- CONTEÚDO -->
    <div class="main-content">

      <div class="book-list-section">

        <div class="section-header">

          <div>

            <h1>Livros</h1>

            <p>
              Gerencie os livros da sua biblioteca
            </p>

          </div>

          <button class="btn-primary" onclick="abrirModal()">
            <i class="fa-solid fa-plus"></i>
            Adicionar Livro
          </button>

        </div>


        <!-- FILTROS -->
        <div class="filters">

          <div class="filter-input">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Filtrar livros..." id="filterInput" />

          </div>


          <select class="filter-select" id="genreFilter">

            <option value="">
              Todos os gêneros
            </option>

          </select>

        </div>


        <!-- LISTA DE LIVROS -->
        <div class="book-list" id="bookList"></div>

      </div>


      <!-- PAINEL DE DETALHES -->
      <div class="detail-panel" id="detailPanel">

        <div class="detail-header">

          <button class="close-btn" onclick="closeDetail()">
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>

        <div id="detailContent"></div>

      </div>

    </div>

  </main>


  <!-- MODAL -->
  <div id="modalLivro" class="modal-overlay" style="display: none;">

    <div class="modal-content">


      <!-- CABEÇALHO DO MODAL -->
      <div class="modal-header">

        <h2 id="modalTitulo">
          Cadastrar Novo Livro
        </h2>

        <button class="close-btn" onclick="fecharModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <!-- INDICADOR DE ETAPAS -->
      <div class="step-indicator">

        <div id="step1-badge" class="step-badge active">
          1. Informações
        </div>

        <div id="step2-badge" class="step-badge">
          2. Capa do Livro
        </div>

      </div>


      <!-- FORMULÁRIO -->
      <form id="formLivro" onsubmit="salvarLivro(event)">


        <!-- ETAPA 1 -->
        <div id="etapa-1" class="modal-step">

          <div class="form-group">

            <label for="titulo">
              Título do Livro *
            </label>

            <input type="text" id="titulo" required placeholder="Ex: Dom Casmurro" />

          </div>


          <div class="form-group">

            <label for="autor_id">
              Autor *
            </label>

            <select id="autor_id" required>

              <option value="">
                Selecione um autor...
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="categoria_id">
              Categoria *
            </label>

            <select id="categoria_id" required>

              <option value="">
                Selecione uma categoria...
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="isbn">
              ISBN
            </label>

            <input type="text" id="isbn" placeholder="Ex: 978-85-359-0271-3" />

          </div>


          <div class="form-group">

            <label for="ano_publicacao">
              Ano de Publicação
            </label>

            <input type="number" id="ano_publicacao" placeholder="Ex: 1899" />

          </div>


          <div class="form-group">

            <label for="editora">
              Editora
            </label>

            <input type="text" id="editora" placeholder="Ex: Companhia das Letras" />

          </div>


          <div class="form-group">

            <label for="sinopse">
              Sinopse
            </label>

            <textarea id="sinopse" rows="3" placeholder="Digite uma breve sinopse do livro..."></textarea>

          </div>


          <div class="modal-actions">

            <button type="button" class="btn-secondary" onclick="fecharModal()">
              Cancelar
            </button>

            <button type="button" class="btn-primary" onclick="irParaEtapa(2)">
              Avançar
              <i class="fa-solid fa-arrow-right"></i>
            </button>

          </div>

        </div>


        <!-- ETAPA 2: Adição da Imagem de Capa -->
        <div id="etapa-2" class="modal-step" style="display: none;">
          <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">
            Escolha uma imagem do seu computador ou cole a URL de uma imagem da internet.
          </p>

          <!-- Opção A: Upload de arquivo do dispositivo -->
          <div class="form-group">
            <label for="imagemFile"><i class="fa-solid fa-upload"></i> Selecionar imagem do dispositivo</label>
            <input type="file" id="imagemFile" accept="image/*" onchange="processarImagemLocal(event)"
              class="file-input">
          </div>

          <div style="text-align: center; margin: 0.5rem 0; color: var(--text-secondary); font-size: 0.8rem;">
            — OU —
          </div>

          <!-- Opção B: Inserir URL da web -->
          <div class="form-group">
            <label for="imagem">URL da Imagem de Capa</label>
            <input type="url" id="imagem" placeholder="https://exemplo.com/capa-do-livro.jpg"
              oninput="atualizarPreviewCapa(this.value)">
          </div>

          <!-- Preview em tempo real da Capa -->
          <div class="cover-preview-container">
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Pré-visualização:</p>
            <div id="coverPreview" class="cover-preview">
              <i class="fa-solid fa-book" id="defaultIcon"></i>
              <img id="imgPreview" src="" alt="Capa do Livro"
                style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 6px;">
            </div>
          </div>

          <div class="modal-actions" style="margin-top: 1.5rem;">
            <button type="button" class="btn-secondary" onclick="irParaEtapa(1)">
              <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>

            <button type="button" class="btn-primary" onclick="salvarLivro(event)">Salvar Livro</button>
          </div>
        </div>

      </form>

    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="../js/script.js"></script>

</body>

</html>
