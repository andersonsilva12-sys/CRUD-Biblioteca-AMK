<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Biblioteca Online</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <nav class="sidebar" id="sidebar">
      <div class="logo">
        <i class="fa-solid fa-book-open"></i>
        <span>Biblioteca Online</span>
      </div>
      <div class="menu">
        <a class="menu-item active">
          <i class="fa-solid fa-book"></i>
          <span>Livros</span>
        </a>
        <a class="menu-item">
          <i class="fa-solid fa-plus"></i>
          <span>Adicionar Livro</span>
        </a>
        <a class="menu-item">
          <i class="fa-solid fa-tag"></i>
          <span>Categorias</span>
        </a>
        <a class="menu-item">
          <i class="fa-solid fa-user"></i>
          <span>Autores</span>
        </a>
      </div>
      <div class="menu-bottom">
        <a class="menu-item">
          <i class="fa-solid fa-gear"></i>
          <span>Configurações</span>
        </a>
        <a class="menu-item">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sair</span>
        </a>
      </div>
    </nav>

    <main class="content">
      <header class="topbar">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Pesquisar por título, autor, ISBN..." />
        </div>
        <div class="user-profile">
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
          <span>Usuário</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </header>

      <div class="main-content">
        <div class="book-list-section">
          <div class="section-header">
            <div>
              <h1>Livros</h1>
              <p>Gerencie os livros da sua biblioteca</p>
            </div>
            <button class="btn-primary"><i class="fa-solid fa-plus"></i> Adicionar Livro</button>
          </div>

          <div class="filters">
            <div class="filter-input">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" placeholder="Filtrar livros..." id="filterInput" />
            </div>
            <select class="filter-select" id="genreFilter">
              <option value="">Todos os gêneros</option>
            </select>
          </div>

          <div class="book-list" id="bookList"></div>
        </div>

        <div class="detail-panel" id="detailPanel">
          <div class="detail-header">
            <button class="close-btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div id="detailContent"></div>
        </div>
      </div>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
